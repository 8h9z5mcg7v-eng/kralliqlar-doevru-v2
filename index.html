<script>

  for(let i=0;i<5;i++)line([[-147+i*8,93-i*4],[-126+i*8,105-i*4]],'#627a3f',3);
  poly([[138,101],[172,82],[192,95],[157,116]],'#9b7953');
  line([[142,91],[168,106],[188,95]],'#a04f36',6);
  // flags
  line([[0,-105],[0,-142]],'#48352a',3);poly([[0,-140],[30,-132],[0,-121]],'#a43f32',null);
  line([54,-46],[54,-72],'#493528',2);poly([[54,-70],[73,-64],[54,-56]],'#b18b45',null);
  // trees around the city
  for(let i=0;i<18;i++){const x=-245+(i*29)%490,y=110+Math.sin(i*3)*38;ctx.fillStyle='#493b2c';ctx.fillRect(x-2,y,4,13);ctx.fillStyle=i%2?'#35583b':'#486b42';ctx.beginPath();ctx.arc(x,y,10+(i%3)*3,0,Math.PI*2);ctx.fill()}
  ctx.restore();

<script>

  el.textContent='3D səhnə xətası: '+msg;
 }
 window.addEventListener('error',e=>report(e.message||'JavaScript xətası'));

     setTimeout(()=>{game[key]=(game[key]||0)+value;game.xp=(game.xp||0)+10;game.lastMarch=target;save();paintResources();info.textContent='Yürüş tamamlandı! +'+value+' '+({wood:'taxta',stone:'daş',iron:'dəmir',gold:'qızıl',food:'ərzaq'}[key])+', +10 təcrübə.';if(marchButton)marchButton.disabled=false;},5000);
   });
   addAction('⚔️ Qara Qartala hücum',()=>{
     if(!target||target!=='rival'){document.querySelector('#targetInfo').textContent='Əvvəlcə qırmızı Qara Qartal nişanını seç.';return}
     const power=(game.infantry||0)+(game.archers||0)*1.2+(game.cavalry||0)*1.5;const cityDefense=getCityDefense();
     if(power<160){document.querySelector('#targetInfo').textContent='Qoşun gücün 160-dan azdır. Əvvəlcə ordu hazırla.';return}
     if(game.food<250){document.querySelector('#targetInfo').textContent='Hücum üçün 250 ərzaq lazımdır.';return}
     game.food-=250;save();paintResources();
     const info=document.querySelector('#targetInfo');
     info.innerHTML='<div class="battle-stage"><div class="battle-side">🛡️<b>SƏNİN ORDUN</b><small>'+power+' hücum gücü · '+cityDefense+' şəhər müdafiəsi</small></div><div class="battle-clash">⚔️</div><div class="battle-side enemy">🏰<b>QARA QARTAL</b><small>160 müdafiə</small></div></div><div class="battle-progress"><i></i></div><div style="text-align:center;color:#f0d39a">Qoşunlar döyüş meydanına irəliləyir...</div>';
     const defense=160+(game.rivalWins||0)*35;
     const roll=power*(.85+Math.random()*.3);
     const won=roll>=defense;
     const battleButton=document.querySelector('#modalActions button:last-child');if(battleButton)battleButton.disabled=true;
     setTimeout(()=>{
       if(won){game.gold+=350;game.wood+=220;game.xp=(game.xp||0)+60;game.rivalWins=(game.rivalWins||0)+1;info.textContent='QƏLƏBƏ! Qara Qartalın müdafiəsi yarıldı. +350 qızıl, +220 taxta, +60 təcrübə.';recordBattle('Qələbə','Qara Qartal','Müdafiə xətti yarıldı. 350 qızıl və 220 taxta qənimət götürüldü.')}
       else{game.infantry=Math.max(0,game.infantry-Math.ceil(game.infantry*.08));game.archers=Math.max(0,game.archers-Math.ceil(game.archers*.06));game.cavalry=Math.max(0,game.cavalry-Math.ceil(game.cavalry*.1));game.xp=(game.xp||0)+12;info.textContent='MƏĞLUBİYYƏT. Qoşunların itki verdi. Qəhrəman +12 təcrübə qazandı.';recordBattle('Məğlubiyyət','Qara Qartal','Hücum dəf edildi. Qoşunların itki verdi.')}
       game.troops=game.infantry+game.archers+game.cavalry;save();paintResources();if(battleButton)battleButton.disabled=false;
     },2600);
   });
 }else if(p==='mail'){
   const reports=game.battleReports||[];
   document.querySelector('#modalText').textContent=reports.length?'Son döyüş və yürüş hesabatları:':'Hələ döyüş hesabatı yoxdur. Dünya xəritəsində yürüşə və döyüşə başla.';
   document.querySelector('#modalTags').innerHTML='<span class="tag">'+reports.length+' hesabat</span><span class="tag">Krallıq poçtu</span>';
   reports.slice(0,6).forEach(r=>{const line=document.createElement('div');line.style.cssText='border:1px solid #80633d;border-radius:6px;padding:7px;margin:6px 0;font-size:11px';line.innerHTML='<b style="color:'+(r.result==='Qələbə'?'#9ac17b':'#d58a78')+'">'+r.result+' · '+r.enemy+'</b><div style="color:#d8c9a9;margin-top:3px">'+r.details+'</div><small style="color:#a99b7d">'+r.date+'</small>';document.querySelector('#modalActions').appendChild(line)});
 }else if(p==='events'){
   game.wallHp??=1000;
   document.querySelector('#modalText').innerHTML='Krallıq hadisələri və şəhər müdafiəsi.<div style="margin:12px 0 5px;font-size:11px">Divarların möhkəmliyi: <b id="wallHpText">'+game.wallHp+'/1000</b></div><div style="height:10px;background:#332b24;border-radius:8px;overflow:hidden"><div id="wallHpBar" style="height:100%;width:'+game.wallHp/10+'%;background:linear-gradient(90deg,#a94b38,#d7b46c)"></div></div><p style="font-size:10px">Düşmən basqınlarını dəf et və zədələnmiş divarları təmir et.</p>';
   document.querySelector('#modalTags').innerHTML='<span class="tag">Sərhəd müharibəsi</span><span class="tag">Müdafiə: '+getCityDefense()+'</span>';
   addAction('🔥 Düşmən basqını başlat',()=>{
     const defense=getCityDefense(),attack=180+(game.raidsSurvived||0)*25;
     const damage=Math.max(25,attack-defense*.45);
     if(defense>=attack){game.gold+=80;game.xp=(game.xp||0)+15;game.raidsSurvived=(game.raidsSurvived||0)+1;document.querySelector('#modalText').innerHTML='🛡️ Basqın dəf edildi! +80 qızıl, +15 təcrübə.<div>Divarların möhkəmliyi: '+game.wallHp+'/1000</div>'}
     else{game.wallHp=Math.max(0,game.wallHp-Math.round(damage));document.querySelector('#modalText').innerHTML='⚠️ Düşmən divarlara zərər vurdu! <b>'+Math.round(damage)+'</b> möhkəmlik itirildi.<div>Divarların möhkəmliyi: '+game.wallHp+'/1000</div>'}
     save();paintResources();
     const bar=document.querySelector('#wallHpBar');if(bar)bar.style.width=game.wallHp/10+'%';
     const hp=document.querySelector('#wallHpText');if(hp)hp.textContent=game.wallHp+'/1000';
   });
   addAction('🧱 Divarları təmir et',()=>{
     const missing=1000-(game.wallHp||1000);
     if(missing<=0){document.querySelector('#modalText').textContent='Divarlar tam möhkəmdir.';return}
     const woodCost=Math.ceil(missing*.35),stoneCost=Math.ceil(missing*.22);
     if(game.wood<woodCost||game.stone<stoneCost){document.querySelector('#modalText').textContent='Təmir üçün resurs çatmır. Lazımdır: '+woodCost+' taxta və '+stoneCost+' daş.';return}
     game.wood-=woodCost;game.stone-=stoneCost;game.wallHp=1000;save();paintResources();
     document.querySelector('#modalText').innerHTML='✅ Divarlar tam təmir edildi!<div>1000/1000 möhkəmlik</div>';
     const bar=document.querySelector('#wallHpBar');if(bar)bar.style.width='100%';const hp=document.querySelector('#wallHpText');if(hp)hp.textContent='1000/1000';
   });
 }else if(p==='hero'){
   document.querySelector('#modalText').textContent='Sənin ilk qəhrəmanın: Qartal sərkərdəsi. Təcrübə: '+(game.xp||0)+'. Kəşfiyyat və döyüşlər qəhrəman təcrübəsi qazandırır.';
   document.querySelector('#modalTags').innerHTML='<span class="tag">Qəhrəman · Səviyyə 1</span><span class="tag">Hücum +5%</span>';
 }else if(p==='alliance'){
   document.querySelector('#modalText').textContent='İttifaq sistemi hələ təkoyunçu prototipidir. Yerli sınaq ittifaqına qoşula bilərsən.';
   addAction('🛡️ Sınaq ittifaqına qoşul',()=>{game.alliance='Qartal Birliyi';save();document.querySelector('#modalText').textContent='Qartal Birliyinə qoşuldun!';document.querySelector('#modalTags').innerHTML='<span class="tag">Qartal Birliyi</span>'});
 }else if(p==='quests'){
   document.querySelector('#modalText').textContent='Gündəlik tapşırıq: 1 dəfə resurs topla, 1 bina inkişaf etdir və 1 dəstə qoşun hazırla.';
   addAction('🎁 Gündəlik mükafatı al',()=>{if(game.questClaimed){document.querySelector('#modalText').textContent='Bu günün mükafatı artıq götürülüb.';return}game.questClaimed=true;game.gold+=100;game.food+=150;save();paintResources();document.querySelector('#modalText').textContent='Mükafat: 100 qızıl və 150 ərzaq!'});
 }
 save();
}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));if(b.closest('.bottom'))b.classList.add('active');const p=b.dataset.panel;const labels={city:'Şəhər',army:'Ordu',world:'Dünya xəritəsi',alliance:'İttifaq',hero:'Qəhrəman',quests:'Tapşırıqlar',mail:'Məktublar',events:'Hadisələr'};showPanel(labels[p]||'Krallıq',p);renderMode(p)});
// Living market square: townsfolk strolling between the stalls
const townsfolk=[];
function makeTownsperson(x,z,tone,phase){
 const person=new THREE.Group();
 const tunic=mat(tone),skin=mat(0xc69b72),belt=mat(0x44352a);
 const torso=new THREE.Mesh(new THREE.CylinderGeometry(.2,.27,.82,7),tunic);torso.position.y=1.02;person.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.19,9,8),skin);head.position.y=1.58;person.add(head);
 const hood=new THREE.Mesh(new THREE.SphereGeometry(.205,8,6,0,Math.PI*2,0,Math.PI/2),belt);hood.position.y=1.62;person.add(hood);
 box(person,0,.78,0,.42,.09,.42,belt);
 const arms=[];
 for(const side of [-1,1]){
   const arm=new THREE.Mesh(new THREE.CylinderGeometry(.075,.09,.55,6),tunic);arm.position.set(side*.27,1.08,0);arm.rotation.z=side*.2;person.add(arm);arms.push(arm);
   const leg=new THREE.Mesh(new THREE.CylinderGeometry(.075,.09,.48,6),belt);leg.position.set(side*.12,.34,0);person.add(leg);
 }
 person.position.set(x,0,z);person.userData={phase,arms,originX:x,originZ:z};scene.add(person);townsfolk.push(person);
}
makeTownsperson(-6.6,8.8,0x8b3930,0);
makeTownsperson(-9.3,7.7,0x42566a,1.3);
makeTownsperson(6.7,-8.5,0x9b8050,2.1);
makeTownsperson(9.1,-7.1,0x52633f,3.2);
makeTownsperson(-3.8,4.8,0x76604b,4.4);
makeTownsperson(4.1,-4.9,0x65465b,5.5);
// Ambient life: soft animated chimney smoke and forge glow
const smokePuffs=[];
function addSmoke(x,z,height){
 const puffMat=new THREE.MeshStandardMaterial({color:0xc7c5bb,transparent:true,opacity:.22,roughness:1,depthWrite:false});
 for(let i=0;i<4;i++){
   const puff=new THREE.Mesh(new THREE.SphereGeometry(.22+i*.055,8,7),puffMat.clone());
   puff.position.set(x+(i%2)*.1,height+i*.42,z);puff.userData={baseY:height+i*.42,phase:i*.9};
   scene.add(puff);smokePuffs.push(puff);
 }
}
addSmoke(-12.1,-3.65,3.2);
addSmoke(-2.1,-13.7,3.3);
const forgeGlow=new THREE.PointLight(0xff8b38,1.1,6);forgeGlow.position.set(-12.5,1.3,-1.6);scene.add(forgeGlow);
function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;sheepFlock.forEach((s,i)=>{const q=t*.22+s.userData.phase;s.position.x=s.userData.homeX+Math.sin(q)*.18;s.position.z=s.userData.homeZ+Math.cos(q*.8)*.12;s.rotation.y=Math.atan2(Math.cos(q)*.18,-Math.sin(q*.8)*.1);s.userData.head.position.y=.66+Math.sin(t*1.8+i)*.035});farmFlock.forEach((b,i)=>{const q=t*.55+b.userData.phase;b.position.x=b.userData.homeX+Math.sin(q)*.42;b.position.z=b.userData.homeZ+Math.cos(q*.8)*.3;b.rotation.y=Math.atan2(Math.cos(q)*.42,-Math.sin(q*.8)*.24);b.children[1].rotation.x=Math.sin(q*2.4)*.28});marketCart.position.x=9.8+Math.sin(t*.42)*1.15;marketCart.position.z=-7.5+Math.cos(t*.42)*.38;marketCart.rotation.y=Math.cos(t*.42)*.1;marketCart.userData.wheels.forEach(w=>w.rotation.x=t*1.7);townsfolk.forEach(p=>{const q=t*.34+p.userData.phase;p.position.x=p.userData.originX+Math.sin(q)*.72;p.position.z=p.userData.originZ+Math.cos(q*.8)*.48;p.rotation.y=Math.atan2(Math.cos(q)*.72,-Math.sin(q*.8)*.38);p.userData.arms.forEach((a,i)=>a.rotation.z=(i===0?1:-1)*Math.sin(q*5)*.16)});smokePuffs.forEach(p=>{p.position.y=p.userData.baseY+Math.sin(t*1.1+p.userData.phase)*.18;p.position.x+=Math.sin(t*.7+p.userData.phase)*.0008;p.material.opacity=.12+((Math.sin(t+p.userData.phase)+1)*.07)});forgeGlow.intensity=.8+Math.sin(t*5)*.25;camera.position.set(Math.sin(rot)*cameraDistance,22+tilt*20,Math.cos(rot)*cameraDistance);camera.lookAt(0,1,0);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>

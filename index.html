<script type="module">
import * as THREE from 'three';
const host=document.querySelector('#scene');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb3b4);scene.fog=new THREE.Fog(0x9eb3b4,38,90);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,180);camera.position.set(19,22,26);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4f0f2,0x586044,2));
const sun=new THREE.DirectionalLight(0xffe1b0,3.2);sun.position.set(-18,28,14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=mat(0x657a4d),earth=mat(0x8a7653),stone=mat(0x92918a),darkStone=mat(0x565d5a),wood=mat(0x69452b),roof=mat(0x65423a),roofBlue=mat(0x344b55),gold=mat(0xc19a50),water=mat(0x426f78,.25);

function cone(parent,x,y,z,r,h,m,n=4){const o=new THREE.Mesh(new THREE.ConeGeometry(r,h,n),m);o.position.set(x,y+h/2,z);o.castShadow=true;parent.add(o);return o}
function cylinder(parent,x,y,z,rt,rb,h,m,n=8){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y+h/2,z);o.castShadow=true;parent.add(o);return o}
function tree(x,z,s=1){const g=new THREE.Group();cylinder(g,0,0,0,.12,.18,1.1*s,wood,6);cone(g,0,.55*s,0,.8*s,1.5*s,mat(0x35533a),7);cone(g,0,1.25*s,0,.58*s,1.2*s,mat(0x476742),7);g.position.set(x,0,z);scene.add(g)}
// broad landscaped island
box(scene,0,-.65,0,40,.8,34,grass);
const edge=new THREE.Mesh(new THREE.BoxGeometry(42,.7,36),earth);edge.position.y=-1.25;scene.add(edge);
// roads and plaza
box(scene,0,-.17,0,5,.12,34,earth);box(scene,0,-.1,0,4.1,.08,34,mat(0xb6a17a));
box(scene,0,-.12,0,40,.1,4.3,earth);box(scene,0,-.05,0,40,.08,3.5,mat(0xb6a17a));
box(scene,0,-.02,0,10,.13,9,stone);
// castle walls and towers
const wallY=2.7,wallH=3.1;box(scene,0,0,-14,32,wallH,.8,stone);box(scene,0,0,14,32,wallH,.8,stone);box(scene,-16,0,0,.8,wallH,28,stone);box(scene,16,0,0,.8,wallH,28,stone);
for(let i=-15;i<=15;i+=2){box(scene,i,wallH,-14,.65,.55,.9,stone);box(scene,i,wallH,14,.65,.55,.9,stone)}for(let i=-12;i<=12;i+=2){box(scene,-16,wallH,i,.9,.55,.65,stone);box(scene,16,wallH,i,.9,.55,.65,stone)}
function tower(x,z){cylinder(scene,x,0,z,1.05,1.2,3.4,stone,8);cone(scene,x,3.35,z,1.25,2.3,roofBlue,8);cylinder(scene,x,2.4,z,1.1,1.1,.2,gold,8)}
tower(-16,-14);tower(16,-14);tower(-16,14);tower(16,14);
// Gate

// keep/castle centerpiece
const castle=new THREE.Group();box(castle,0,0,0,6,4.2,5,stone);box(castle,0,4.2,0,4.8,.45,4,stone);box(castle,0,4.65,0,2.2,2.5,2.2,stone);
for(const [x,z] of [[-2.5,-2],[2.5,-2],[-2.5,2],[2.5,2]]){cylinder(castle,x,3.1,z,.62,.72,2.1,stone,8);cone(castle,x,5.1,z,.78,1.6,roofBlue,8)}
box(castle,0,0,2.55,1.5,2.6,.25,wood);box(castle,0,2.7,0,1.1,.25,1.1,gold);castle.position.set(0,.05,0);castle.userData={name:'Baş Qala',kind:'castle',level:1};scene.add(castle);
// individual city buildings with separate silhouettes
function house(x,z,name,kind='house',scale=1){const g=new THREE.Group();const w=kind==='hall'?3.8:2.7,d=kind==='hall'?3.1:2.5,h=kind==='stable'?1.8:2.2;
box(g,0,0,0,w*scale,h*scale,d*scale,kind==='barracks'?stone:wood);
if(kind==='stable'){box(g,0,h*scale,0,w*scale*.55,.35*scale,d*scale*1.15,roof);box(g,-.55*scale,.2,1.27*scale,.55*scale,1.1*scale,.15,wood);box(g,.55*scale,.2,1.27*scale,.55*scale,1.1*scale,.15,wood)}
else {const r=kind==='hall'?roofBlue:roof;const a=cone(g,0,h*scale,0,Math.max(w,d)*.72*scale,1.35*scale,r,4);a.rotation.y=Math.PI/4}
box(g,0,.1,.0,.7*scale,1.2*scale,.08,gold).position.z=d*scale/2+.04;
g.position.set(x,0,z);g.userData={name,kind};scene.add(g);return g}
const buildings=[
house(-5,-4,'Kazarma','barracks'),house(5,-4,'Atçılıq tövləsi','stable'),house(-5,4,'Oxçular meydanı','archery'),house(5,4,'Anbar','store'),house(-13,-3,'Dəmirçi','forge'),house(13,3,'Bazar','market'),house(-14,4,'Taxtaçı','lumber'),house(14,-4,'Təsərrüfat','farm'),house(-3,-13,'Şura binası','hall'),house(4,13,'Məbəd','temple')
];
// Architectural detailing pass: timber frames, windows, signs and distinct roof features
for(const b of buildings){
 const {kind,name}=b.userData;
 const frame=mat(0x3d3025), plaster=mat(kind==='barracks'?0xaaa99a:0xc4ad83), glass=mat(0x263d49,.35);
 // Front door and paired windows
 box(b,0,.12,1.29,.62,1.32,.12,frame);
 box(b,0,.18,1.36,.42,1.05,.04,wood);
 for(const x of [-.82,.82]){
   box(b,x,1.05,1.29,.38,.55,.1,frame);
   box(b,x,1.08,1.35,.25,.4,.035,glass);
   box(b,x,1.08,1.38,.045,.48,.025,gold);
   box(b,x,1.08,1.38,.3,.04,.025,gold);
 }
 // Stone footings and timber cross-beams make silhouettes less block-like
 box(b,0,.12,0,2.85,.22,2.62,darkStone);
 box(b,0,1.85,1.27,2.8,.12,.12,frame);
 if(kind==='barracks'||kind==='hall'){
   for(let x=-1.05;x<=1.05;x+=.7)box(b,x,2.28,0,.12,.32,.12,gold);
 }
 if(kind==='stable'){
   // Open stable bays and hay bundles
   for(const x of [-.72,0,.72]){
     box(b,x,.78,1.32,.12,1.45,.12,frame);
     const hay=new THREE.Mesh(new THREE.ConeGeometry(.38,.48,6),mat(0xb49a50));
     hay.position.set(x,.5,-.9);hay.rotation.z=Math.PI/2;hay.castShadow=true;b.add(hay);
   }
   box(b,0,1.98,0,1.9,.12,.12,frame);
 }else{
   // Ridge beam, roof-end trim and chimney
   box(b,0,3.05,0,.16,.18,2.5,frame);
   box(b,-1.2,2.45,0,.12,.2,2.2,frame);
   box(b,1.2,2.45,0,.12,.2,2.2,frame);
   if(['forge','hall','temple'].includes(kind)){
     box(b,.86,2.25,-.65,.38,1.1,.42,stone);
     box(b,.86,2.82,-.65,.5,.12,.54,darkStone);
   }
 }
 // Small hanging signboards uniquely identify the building
 const sign=new THREE.Mesh(new THREE.BoxGeometry(1.05,.34,.1),mat(kind==='market'?0x8c6337:0x4b493d));
 sign.position.set(1.42,1.75,1.34);sign.castShadow=true;b.add(sign);
 for(const x of [1.05,1.78])cylinder(b,x,1.45,1.34,.035,.04,.62,frame,5);
}
// farm plots and water well
for(let i=0;i<4;i++){box(scene,11+i*.8,-.02,-11, .55,.12,2.7,mat(i%2?0x8d9a50:0xb39a5c))}
cylinder(scene,-13,0,0,.8,.8,.35,stone,8);cylinder(scene,-13,.35,0,.5,.5,.2,water,12);box(scene,-13,1.1,0,.12,1.4,.12,wood);
for(let i=0;i<30;i++){const a=i*2.399;const r=14+Math.random()*4;tree(Math.cos(a)*r,Math.sin(a)*r,.65+Math.random()*.6)}
// little rocks
for(let i=0;i<25;i++){const x=(Math.random()-.5)*35,z=(Math.random()-.5)*29;if(Math.abs(x)<10&&Math.abs(z)<9)continue;const o=new THREE.Mesh(new THREE.DodecahedronGeometry(.25+Math.random()*.35,0),stone);o.position.set(x,.05,z);o.castShadow=true;scene.add(o)}

// city-detail pass: pavements, banners, lamps, market stalls, crop rows and gardens
(()=>{
 const paving=mat(0x9a927e), pavingDark=mat(0x77766c), iron=mat(0x343a38), clothRed=mat(0x8b3930), clothBlue=mat(0x344f67), leafA=mat(0x526c3d), leafB=mat(0x6b8048), crop=mat(0xb6a05b);
 // Stone paving around the central keep and along the main avenues
 for(let i=-4;i<=4;i++){
   box(scene,i*1.05,.015,6.1,.82,.07,.72,paving);
   box(scene,i*1.05,.015,-6.1,.82,.07,.72,paving);
 }
 for(let i=-12;i<=12;i++){
   if(i%2===0){box(scene,-2.55,.02,i*1.08,.62,.07,.68,pavingDark);box(scene,2.55,.02,i*1.08,.62,.07,.68,pavingDark)}
 }
 // Decorative lanterns on the inner roads

 [[-3.8,-8],[3.8,-8],[-3.8,8],[3.8,8],[-8,0],[8,0]].forEach(p=>lamp(p[0],p[1]));
 // Small flags on the keep and gate

   cylinder(scene,x,y,z,.045,.055,1.35,wood,6);

   cloth.position.set(x+.43,y+1.02,z);cloth.rotation.y=-.12;scene.add(cloth);
 }
 flag(-.2,5.1,0,clothRed);flag(0,2.8,14.8,clothBlue);

function animateCityMarch(destination){

 const end=routes[destination]||[-15,0],begin=performance.now(),duration=5000;
 function step(now){
   const t=Math.min(1,(now-begin)/duration),ease=t*t*(3-2*t);
   squad.position.set((end[0]+8)*ease,0,end[1]*ease);
   clones.forEach((unit,i)=>{unit.position.y=Math.abs(Math.sin(t*32+i*.7))*.12;unit.rotation.y=Math.sin(t*32+i*.7)*.08});

 }

       else{game.infantry=Math.max(0,game.infantry-Math.ceil(game.infantry*.08));game.archers=Math.max(0,game.archers-Math.ceil(game.archers*.06));game.cavalry=Math.max(0,game.cavalry-Math.ceil(game.cavalry*.1));game.xp=(game.xp||0)+12;info.textContent='MƏĞLUBİYYƏT. Qoşunların itki verdi. Qəhrəman +12 təcrübə qazandı.';recordBattle('Məğlubiyyət','Qara Qartal','Hücum dəf edildi. Qoşunların itki verdi.')}
       game.troops=game.infantry+game.archers+game.cavalry;save();paintResources();if(battleButton)battleButton.disabled=false;
     },2600);
   });
 }else if(p==='mail'){
   const reports=game.battleReports||[];
   document.querySelector('#modalText').textContent=reports.length?'Son döyüş və yürüş hesabatları:':'Hələ döyüş hesabatı yoxdur. Dünya xəritəsində yürüşə və döyüşə başla.';
   document.querySelector('#modalTags').innerHTML='<span class="tag">'+reports.length+' hesabat</span><span class="tag">Krallıq poçtu</span>';
   reports.slice(0,6).forEach(r=>{const line=document.createElement('div');line.style.cssText='border:1px solid #80633d;border-radius:6px;padding:7px;margin:6px 0;font-size:11px';line.innerHTML='<b style="color:'+(r.result==='Qələbə'?'#9ac17b':'#d58a78')+'">'+r.result+' · '+r.enemy+'</b><div style="color:#d8c9a9;margin-top:3px">'+r.details+'</div><small style="color:#a99b7d">'+r.date+'</small>';document.querySelector('#modalActions').appendChild(line)});
 }else if(p==='events'){
   game.wallHp??=1000;
   document.querySelector('#modalText').innerHTML='Krallıq hadisələri və şəhər müdafiəsi.<div style="margin:12px 0 5px;font-size:11px">Divarların möhkəmliyi: <b id="wallHpText">'+game.wallHp+'/1000</b></div><div style="height:10px;background:#332b24;border-radius:8px;overflow:hidden"><div id="wallHpBar" style="height:100%;width:'+game.wallHp/10+'%;background:linear-gradient(90deg,#a94b38,#d7b46c)"></div></div><p style="font-size:10px">Düşmən basqınlarını dəf et və zədələnmiş divarları təmir et.</p>';
   document.querySelector('#modalTags').innerHTML='<span class="tag">Sərhəd müharibəsi</span><span class="tag">Müdafiə: '+getCityDefense()+'</span>';
   addAction('🔥 Düşmən basqını başlat',()=>{
     const defense=getCityDefense(),attack=180+(game.raidsSurvived||0)*25;
     const damage=Math.max(25,attack-defense*.45);
     if(defense>=attack){game.gold+=80;game.xp=(game.xp||0)+15;game.raidsSurvived=(game.raidsSurvived||0)+1;document.querySelector('#modalText').innerHTML='🛡️ Basqın dəf edildi! +80 qızıl, +15 təcrübə.<div>Divarların möhkəmliyi: '+game.wallHp+'/1000</div>'}
     else{game.wallHp=Math.max(0,game.wallHp-Math.round(damage));document.querySelector('#modalText').innerHTML='⚠️ Düşmən divarlara zərər vurdu! <b>'+Math.round(damage)+'</b> möhkəmlik itirildi.<div>Divarların möhkəmliyi: '+game.wallHp+'/1000</div>'}
     save();paintResources();
     const bar=document.querySelector('#wallHpBar');if(bar)bar.style.width=game.wallHp/10+'%';
     const hp=document.querySelector('#wallHpText');if(hp)hp.textContent=game.wallHp+'/1000';
   });
   addAction('🧱 Divarları təmir et',()=>{
     const missing=1000-(game.wallHp||1000);
     if(missing<=0){document.querySelector('#modalText').textContent='Divarlar tam möhkəmdir.';return}
     const woodCost=Math.ceil(missing*.35),stoneCost=Math.ceil(missing*.22);
     if(game.wood<woodCost||game.stone<stoneCost){document.querySelector('#modalText').textContent='Təmir üçün resurs çatmır. Lazımdır: '+woodCost+' taxta və '+stoneCost+' daş.';return}
     game.wood-=woodCost;game.stone-=stoneCost;game.wallHp=1000;save();paintResources();
     document.querySelector('#modalText').innerHTML='✅ Divarlar tam təmir edildi!<div>1000/1000 möhkəmlik</div>';
     const bar=document.querySelector('#wallHpBar');if(bar)bar.style.width='100%';const hp=document.querySelector('#wallHpText');if(hp)hp.textContent='1000/1000';
   });
 }else if(p==='hero'){
   document.querySelector('#modalText').textContent='Sənin ilk qəhrəmanın: Qartal sərkərdəsi. Təcrübə: '+(game.xp||0)+'. Kəşfiyyat və döyüşlər qəhrəman təcrübəsi qazandırır.';
   document.querySelector('#modalTags').innerHTML='<span class="tag">Qəhrəman · Səviyyə 1</span><span class="tag">Hücum +5%</span>';
 }else if(p==='alliance'){
   document.querySelector('#modalText').textContent='İttifaq sistemi hələ təkoyunçu prototipidir. Yerli sınaq ittifaqına qoşula bilərsən.';
   addAction('🛡️ Sınaq ittifaqına qoşul',()=>{game.alliance='Qartal Birliyi';save();document.querySelector('#modalText').textContent='Qartal Birliyinə qoşuldun!';document.querySelector('#modalTags').innerHTML='<span class="tag">Qartal Birliyi</span>'});
 }else if(p==='quests'){
   document.querySelector('#modalText').textContent='Gündəlik tapşırıq: 1 dəfə resurs topla, 1 bina inkişaf etdir və 1 dəstə qoşun hazırla.';
   addAction('🎁 Gündəlik mükafatı al',()=>{if(game.questClaimed){document.querySelector('#modalText').textContent='Bu günün mükafatı artıq götürülüb.';return}game.questClaimed=true;game.gold+=100;game.food+=150;save();paintResources();document.querySelector('#modalText').textContent='Mükafat: 100 qızıl və 150 ərzaq!'});
 }
 save();
}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));if(b.closest('.bottom'))b.classList.add('active');const p=b.dataset.panel;const labels={city:'Şəhər',army:'Ordu',world:'Dünya xəritəsi',alliance:'İttifaq',hero:'Qəhrəman',quests:'Tapşırıqlar',mail:'Məktublar',events:'Hadisələr'};showPanel(labels[p]||'Krallıq',p);renderMode(p)});
function animate(){requestAnimationFrame(animate);camera.position.set(Math.sin(rot)*cameraDistance,22+tilt*20,Math.cos(rot)*cameraDistance);camera.lookAt(0,1,0);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>

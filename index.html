<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#18251c"><title>Krallıqlar Dövrü</title>
<style>
:root{--gold:#e8c77c;--panel:rgba(18,27,23,.94);--line:rgba(232,199,124,.42);--cream:#f4e7c9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17251e;color:var(--cream);font-family:Georgia,serif;touch-action:none}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.top{position:fixed;top:env(safe-area-inset-top,8px);left:8px;right:8px;display:flex;align-items:center;justify-content:space-between;gap:6px;z-index:3;pointer-events:none}.brand,.resources,.king{background:linear-gradient(180deg,rgba(37,48,38,.96),rgba(13,21,17,.94));border:1px solid var(--line);box-shadow:0 4px 16px #0008;border-radius:10px;padding:8px 10px;pointer-events:auto}.brand{font-weight:bold;color:var(--gold);font-size:clamp(11px,2.7vw,16px);letter-spacing:.7px;white-space:nowrap}.resources{display:flex;gap:clamp(5px,2vw,14px);font:600 clamp(10px,2.5vw,14px) Arial,sans-serif;flex-wrap:wrap;justify-content:center}.resources span{white-space:nowrap}.resources b{color:#f6d58e}.king{font:11px Arial,sans-serif;white-space:nowrap;color:#d8e2d0}.hint{position:fixed;top:76px;left:50%;transform:translateX(-50%);padding:6px 10px;background:#101a16b8;border:1px solid #ffffff22;border-radius:20px;color:#e8e0cb;font:11px Arial;white-space:nowrap;z-index:2}.bottom{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;z-index:4}.nav{border:1px solid var(--line);border-radius:10px;background:linear-gradient(#344333,#18251c);color:var(--cream);padding:10px 2px 9px;font:bold clamp(10px,2.4vw,13px) Arial;box-shadow:0 4px 12px #0008}.panel{position:fixed;z-index:5;left:10px;right:10px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 35px #000b;display:none;max-height:48vh;overflow:auto}.panel.show{display:block}.panel h2{font-size:1 </style></head><body>
<div id="scene"></div><div class="top"><div class="brand">⚔ KRALLIQLAR DÖVRÜ</div><div class="resources"><span>🪵 <b id="wood">1200</b></span><span>🪨 <b id="stone">900</b></span><span>🌾 <b id="food">1500</b></span><span>🪙 <b id="gold">250</b></span></div><div class="king">KRAL · I SƏVİYYƏ</div></div>
<div class="hint">Şəhəri döndər · iki barmaqla yaxınlaşdır</div><div id="toast"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const root=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9ba9a2);scene.fog=new THREE.Fog(0x9ba9a2,65,150);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,220),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdde8ff,0x49513a,2.1));const sun=new THREE.DirectionalLight(0xffe0b0,3.2);sun.position.set(-25,45,25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}),grass=mat(0x526d42),soil=mat(0x8c7656),stone=mat(0x99958a),lightStone=mat(0xbab3a1),roof=mat(0x493b36),wood=mat(0x553a27),dark=mat(0x252522),gold=mat(0xc79a4a,.45,.35),leaf=mat(0x315438),crop=mat(0xb49a4b),water=mat(0x3d777b,.28);
function box(parent,name,x,y,z,w,h,d,material){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.name=name;o.position.set(x,y+h/2,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cyl(parent,name,x,y,z,rt,rb,h,material,n=12){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),material);o.name=name;o.position.set(x,y+h/2,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cone(parent,name,x,y,z,r,h,material){const o=new THREE.Mesh(new THREE.ConeGeometry(r,h,8),material);o.name=name;o.position.set(x,y+h/2,z);o.castShadow=true;parent.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
const city=new THREE.Group();scene.add(city);box(city,'Qala meydançası',0,-.1,0,31,.5,27,soil);box(city,'Daxili yaşıl meydan',0,.4,0,29,.12,25,grass);
box(city,'Şimal divarı',0,.65,12.2,29,3.3,1.1,lightStone);box(city,'Cənub divarı',0,.65,-12.2,29,3.3,1.1,lightStone);box(city,'Şərq divarı',14.1,.65,0,1.1,3.3,24,lightStone);box(city,'Qərb divarı',-14.1,.65,0,1.1,3.3,24,lightStone);
for(let i=-13;i<=13;i+=1.5){if(Math.abs(i)>2.4){box(city,'Divar dişi',i,4,12.2,.7,.55,1.2,lightStone);box(city,'Divar dişi',i,4,-12.2,.7,.55,1.2,lightStone)}}for(let i=-10;i<=10;i+=1.5){box(city,'Divar dişi',14.1,4,i,1.2,.55,.7,lightStone);box(city,'Divar dişi',-14.1,4,i,1.2,.55,.7,lightStone)}
function tower(x,z){cyl(city,'Müdafiə qülləsi',x,.7,z,1.05,1.15,4.2,stone);cyl(city,'Qüllə haşiyəsi',x,4.8,z,1.22,1.22,.25,lightStone);cone(city,'Qüllə damı',x,5,z,1.35,2.1,roof);box(city,'Ox yarığı',x,2.2,z-1.04,.15,.85,.06,dark)}[[-14.1,-12.2],[14.1,-12.2],[-14.1,12.2],[14.1,12.2]].forEach(p=>tower(...p));
box(city,'Darvaza sol',-2.15,.6,-12.2,2,4.4,2.1,stone);box(city,'Darvaza sağ',2.15,.6,-12.2,2,4.4,2.1,stone);box(city,'Darvaza üstü',0,4.5,-12.2,6.4,.8,2.2,lightStone);box(city,'Darvaza taxtası',0,.7,-11.05,3.5,3,.18,wood);for(let i=-1.5;i<=1.5;i+=.5)box(city,'Darvaza dəmiri',i,.8,-10.94,.06,2.8,.08,gold);
function building(name,x,z,w,d,wall=lightStone){const g=new THREE.Group();g.name=name;city.add(g);box(g,name+' bünövrəsi',0,.55,0,w+.45,.55,d+.45,stone);box(g,name+' bina',0,1.1,0,w,2.4,d,wall);const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,1.45,4),roof);r.rotation.y=Math.PI/4;r.scale.set(w/Math.max(w,d),1,d/Math.max(w,d));r.position.set(0,4.0,0);r.castShadow=true;g.add(r);box(g,name+' qapı',0,.62,-d/2-.035,.72,1.25,.1,wood);box(g,name+' lövhə',0,2.5,-d/2-.1,1.2,.34,.1,gold);const hit=new THREE.Mesh(new THREE.BoxGeometry(w+1,4,d+1),new THREE.MeshBasicMaterial({transparent:true,opacity:0}));hit.position.y=2;hit.name=name+'__select';g.add(hit);return g}
const keep=building('Baş qala',0,3,8.2,7.5,lightStone);box(keep,'Qalanın yuxarı mərtəbəsi',0,3.5,0,5.7,1.8,5.2,stone);for(const x of [-4.3,4.3])for(const z of [-3.9,3.9]){cyl(keep,'Qala qülləsi',x,.7,z,.8,.9,6,lightStone);cone(keep,'Qüllə damı',x,6.7,z,1.05,1.8,roof)}for(let i=-2;i<=2;i++){box(keep,'Qala pəncərəsi',i*1.25,2.5,-3.82,.34,.8,.08,dark);box(keep,'Pəncərə çərçivəsi',i*1.25,2.2,-3.9,.5,.1,.12,gold)}cyl(keep,'Bayraq dirəyi',0,9,3,.07,.07,3,gold,8);box(keep,'Kral bayrağı',.55,9.7,3,1.1,1.4,.08,mat(0x8e2927));
building('Kazarma',-8,4,4.2,3.8);building('Tövlə',8,4,4.2,3.8);building('Odunçu düşərgəsi',-8,-5,3.7,3.2);building('Daş karxanası',7,-5,3.8,3.2);building('Bazar',0,-7.5,3.8,3.2);
box(city,'Kral yolu',0,.48,-1.5,1.5,.06,soil);box(city,'Mərkəzi yol',0,.49,-4,18,.06,soil);for(let i=0;i<4;i++){box(city,'Əkin sahəsi',-19+i*2.1,.1,2,1.6,.18,4,soil);for(let j=0;j<5;j++)box(city,'Taxıl cərgəsi',-19+i*2.1,.23,.4+j*.72,1.35,.1,.07,crop)}
function tree(x,z,s=1){cyl(city,'Ağac gövdəsi',x,0,z,.18*s,.25*s,1.5*s,wood,7);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.15*s,1),leaf);crown.position.set(x,2*s,z);crown.castShadow=true;city.add(crown);const crown2=new THREE.Mesh(new THREE.IcosahedronGeometry(.78*s,1),mat(0x45683d));crown2.position.set(x+.35*s,2.65*s,z+.12*s);crown2.castShadow=true;city.add(crown2)}for(let i=0;i<48;i++){const a=i*2.399,r=19+(i%4)*2.2;tree(Math.cos(a)*r,Math.sin(a)*r,.8+(i%3)*.13)}cyl(city,'Göl',20,-.02,16,4.2,4.2,.12,water,32).rotation.x=Math.PI/2;
const cameraTarget=new THREE.Vector3(0,2,0);let yaw=.68,pitch=.78,dist=54;function updateCamera(){const p=Math.max(.38,Math.min(1.12,pitch));camera.position.set(cameraTarget.x+Math.sin(yaw)*Math.cos(p)*dist,cameraTarget.y+Math.sin(p)*dist,cameraTarget.z+Math.cos(yaw)*Math.cos(p)*dist);camera.lookAt(cameraTarget)}updateCamera();
let pointers=new Map(),last=null,pinch=0;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)last={x:e.clientX,y:e.clientY};if(pointers.size===2){const a=[...pointers.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&last){yaw-=(e.clientX-last.x)*.006;pitch=Math.max(.38,Math.min(1.12,pitch+(e.clientY-last.y)*.004));last={x:e.clientX,y:e.clientY};updateCamera()}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);dist=Math.max(30,Math.min(78,dist+(pinch-d)*.045));pinch=d;updateCamera()}});function release(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=0;if(pointers.size===0)last=null}renderer.domElement.addEventListener('pointerup',release);renderer.domElement.addEventListener('pointercancel',release);renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(30,Math.min(78,dist+e.deltaY*.04));updateCamera()},{passive:true});
let state={wood:1200,stone:900,food:1500,gold:250,infantry:120,archers:80,cavalry:40,levels:{}};try{const saved=JSON.parse(localStorage.getItem('kd_save')||'null');if(saved)state={...state,...saved,levels:{...state.levels,...saved.levels}}}catch{}const $=id=>document.getElementById(id);function save(){localStorage.setItem('kd_save',JSON.stringify(state));renderResources()}function renderResources(){$('wood').textContent=state.wood;$('stone').textContent=state.stone;$('food').textContent=state.food;$('gold').textContent=state.gold}let toastTimer;function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',1900)}
const panel=$('panel'),title=$('ptitle'),desc=$('pdesc'),actions=$('actions');function show(t,d,buttons=[]){title.textContent=t;desc.textContent=d;actions.innerHTML='';for(const [label,fn] of buttons){const b=document.createElement('button');b.className='action';b.textContent=label;b.onclick=fn;actions.appendChild(b)}panel.classList.add('show')}$('close').onclick=()=>panel.classList.remove('show');
function train(kind){const costs={infantry:[100,30,0,0,10],archers:[100,40,0,0,10],cavalry:[100,0,0,20,5]}[kind];if(state.food<costs[0]||state.wood<costs[1]||state.gold<costs[3]){toast('Təlim üçün resurs çatmır');return}state.food-=costs[0];state.wood-=costs[1];state.gold-=costs[3];state[kind]+=costs[4];save();show('Ordu təlimi','Piyada: '+state.infantry+' · Oxçu: '+state.archers+' · Süvari: '+state.cavalry,[['+10 Piyada',()=>train('infantry')],['+10 Oxçu',()=>train('archers')],['+5 Süvari',()=>train('cavalry')]])}
function upgrade(name){const lvl=state.levels[name]||1,cost=100*lvl;if(state.wood<cost||state.stone<Math.floor(cost*.55)){toast('İnkişaf üçün odun və daş çatmır');return}state.wood-=cost;state.stone-=Math.floor(cost*.55);state.levels[name]=lvl+1;save();toast(name+' '+(lvl+1)+'-ci səviyyəyə yüksəldi');openBuilding(name)}
function openBuilding(name){const lvl=state.levels[name]||1;show(name,'Səviyyə '+lvl+' · İnkişaf xərci: '+(100*lvl)+' odun və '+Math.floor(55*lvl)+' daş.',[['İNKİŞAF ET',()=>upgrade(name)],['RESURS TOPLA',()=>{state.wood+=50;state.stone+=35;state.food+=75;save();toast('Resurslar toplandı')} ]])}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(city.children,true);for(const h of hits){let o=h.object;while(o&&o.parent!==city)o=o.parent;if(o&&['Baş qala','Kazarma','Tövlə','Odunçu düşərgəsi','Daş karxanası','Bazar'].includes(o.name)){openBuilding(o.name);break}}});
function nav(which){if(which==='city')show('Krallıq şəhəri','Şəhərinin binalarını seç, inkişaf etdir və resurslarını topla.',[['50 ODUN + 35 DAŞ',()=>{state.wood+=50;state.stone+=35;state.food+=75;save();toast('Resurslar toplandı')}]]);if(which==='army')show('Qoşunların təlimi','Piyada: '+state.infantry+' · Oxçu: '+state.archers+' · Süvari: '+state.cavalry,[['+10 Piyada',()=>train('infantry')],['+10 Oxçu',()=>train('archers')],['+5 Süvari',()=>train('cavalry')]]);if(which==='world')show('Dünya xəritəsi','Dünya xəritəsi növbəti mərhələdə açılacaq. Hazırda bu sınaq versiyasında şəhər səhnəsi aktivdir.');if(which==='heroes')show('Qəhrəmanlar','Qəhrəman sistemi hazırlanır. Burada sərkərdələr, bacarıqlar və təchizat olacaq.');if(which==='alliance')show('İttifaq','İttifaq sistemi üçün server və multiplayer infrastrukturu növbəti mərhələdə qurulacaq.')}
